# Roadmap ledger - single source of truth for feature status.
#
# This file owns: ID, title, phase, priority, proposed dependencies, status,
# coverage, spec/ADR links, known gaps and the commit at which a status was
# last verified. Every other place that states a status (docs/roadmap.md tables,
# docs/features/README.md, README.md "Status", AGENTS.md "Current product
# phase", spec `**Status:**` headers, plan checkboxes, the public feed of REL2)
# must be generated from this file or checked against it. Do not edit a status
# anywhere else. See docs/audits/2026-11-18-roadmap-tracking-consistency.md.
#
# Two independent axes (they were conflated before, which is the main source
# of disagreement between the repo docs and the 2026-11-18 review):
#
#   status    - the state of the repo's own contract (spec + ADR + code).
#               planned     no spec
#               draft       spec and/or ADR exist, no code merged
#               accepted    spec accepted by the owner, no code merged
#               in_progress some code merged, spec acceptance criteria still open
#               implemented every acceptance criterion of the spec is covered
#   coverage  - how much of the ORIGINAL product roadmap item (PDF scope) the
#               implemented status delivers.
#               full | partial | none
#
# A feature may be `implemented` with `coverage: partial` (the spec narrowed
# the scope on purpose, e.g. JSONL instead of SQLite). Such gaps are listed in
# `gaps`. Never encode "partially done" in `status`.
#
# `verified` is the short commit hash at which status was last checked against
# code and tests. `source` says how: `code` (checked in this repo at that
# commit) or `review@4578233` (taken from the 2026-11-18 spec-vs-repo review
# and not re-verified). Update both whenever a status changes.

