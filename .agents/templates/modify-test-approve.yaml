# Template: modify -> test -> approve. Runs as it is, with nothing to fill in.
# "modify" stands in for a change step, "test" checks that change with a bounded
# loop and a gate, and "approve" waits for your decision before "done" runs.
# The commands only print text: nothing is read, written or sent. To use it
# for real, replace the "modify" and "test" scripts with your own commands.
schema_version: 0
id: modify-test-approve
name: Modify, test, approve
inputs: {}
nodes:
  modify:
    type: shell
    config:
      command: /usr/bin/printf
      args: ["Proposed change: rename one helper (simulated, no file was changed)"]
    outputs:
      stdout: {type: string, required: true}
  test:
    type: shell
    inputs:
      change: {type: string, required: true}
    config:
      command: /bin/sh
      args:
        - -c
        - 'if [ -n "$CHANGE" ]; then printf "{\"passed\":true}"; else printf "{\"passed\":false}"; fi'
      input_env: {change: CHANGE}
      stdout_json: true
    outputs:
      json: {type: json, required: true}
    loop:
      max_attempts: 3
      gate:
        inputs:
          candidate: {type: json, required: true}
        config:
          check_id: tests-passed
          kind: json_predicate
          input: candidate
          field: [passed]
          operator: eq
          expected: true
      bindings:
        - {from: candidate.outputs.json, to: gate.inputs.candidate}
  approve:
    type: human
    config:
      prompt: The test passed. Approve this change?
      context_inputs: [change]
    inputs:
      change: {type: string, required: true}
      report: {type: json, required: true}
    outputs:
      decision: {type: string, required: true}
  done:
    type: shell
    config:
      command: /usr/bin/printf
      args: ["approved\n"]
    inputs:
      decision: {type: string, required: true}
edges:
  - {from: modify.outputs.stdout, to: test.inputs.change}
  - {from: modify.outputs.stdout, to: approve.inputs.change}
  - {from: test.outputs.json, to: approve.inputs.report}
  - {from: approve.outputs.decision, to: done.inputs.decision}
outputs: {}
metadata:
  layout:
    nodes:
      modify: {x: 0, y: 0}
      test: {x: 320, y: 0}
      approve: {x: 640, y: 0}
      done: {x: 960, y: 0}
